name: Deploy Assistente IA

on:
  push:
    branches: [ "main" ]

jobs:
  testar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Configurar Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.10"
      - name: Instalar dependências
        run: pip install -r requirements.txt
      - name: Rodar testes
        run: python testes.py

  publicar:
    needs: testar
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Publicar no Hugging Face
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: git push https://huggingface.co/spaces/seu_usuario/seu_space main
